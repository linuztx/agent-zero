<html>

<head>
  <title>Discord Integration</title>
  <script type="module">
    import { store } from "/plugins/_discord_integration/webui/discord-config-store.js";
  </script>
</head>

<body>
  <div x-data x-init="$store.discordConfig.init(config, context)" x-destroy="$store.discordConfig.cleanup()">
    <template x-if="config">
      <div class="dc-page">
        <div class="section-title">Discord</div>

        <template x-if="$store.discordConfig.didInit && $store.discordConfig.bots.length === 0">
          <div class="dc-empty">
            <div class="dc-empty-title">Start with one bot</div>
            <div class="dc-empty-copy">
              Create a Discord application, grab the bot token, and wire it up here.
            </div>
            <button class="btn btn-field" @click="$store.discordConfig.addBot()">
              Connect a bot
            </button>
          </div>
        </template>

        <template x-for="(bot, idx) in $store.discordConfig.bots" :key="idx">
          <div class="dc-card">
            <div class="dc-card-header" @click="$store.discordConfig.toggleEditing(idx)">
              <div class="dc-card-heading">
                <div class="dc-card-title" x-text="$store.discordConfig.botTitle(bot, idx)"></div>
                <div class="dc-card-subtitle" x-text="$store.discordConfig.botSubtitle(bot)"></div>
              </div>
              <div class="dc-card-actions">
                <span class="dc-status-pill" :class="'tone-' + $store.discordConfig.botStatusTone(bot)"
                  x-text="$store.discordConfig.botStatusLabel(bot)"></span>
                <button class="btn btn-action delete"
                  @click.stop="$confirmClick($event, () => $store.discordConfig.removeBot(idx))" title="Remove bot">
                  <span class="material-symbols-outlined">delete</span>
                </button>
                <span class="material-symbols-outlined dc-card-chevron"
                  :class="{ 'is-open': $store.discordConfig.editing === idx }">expand_more</span>
              </div>
            </div>

            <template x-if="$store.discordConfig.editing === idx">
              <div class="dc-card-body">
                <div class="dc-step-header">
                  <div class="dc-step-copy">
                    <div class="dc-step-title" x-text="$store.discordConfig.currentStepMeta().title"></div>
                    <div class="dc-step-description" x-text="$store.discordConfig.currentStepMeta().description"></div>
                  </div>
                  <div class="dc-step-dots" aria-hidden="true">
                    <template x-for="(step, stepIdx) in $store.discordConfig.steps" :key="step.title">
                      <button type="button" class="dc-step-dot"
                        :class="{ 'is-active': $store.discordConfig.currentStep === stepIdx }"
                        @click="$store.discordConfig.setStep(stepIdx)"></button>
                    </template>
                  </div>
                </div>

                <template x-if="$store.discordConfig.currentStep === 0">
                  <div class="dc-step-panel">
                    <div class="dc-token-steps">
                      <div class="dc-token-steps-title">Create your bot</div>
                      <ol class="dc-token-steps-list">
                        <li>Open the <a href="https://discord.com/developers/applications" target="_blank"
                            rel="noopener">Discord Developer Portal</a></li>
                        <li>Create a new <strong>Application</strong>, then open the <strong>Bot</strong> tab</li>
                        <li>Reset the token and paste it below</li>
                        <li>Under <strong>Privileged Gateway Intents</strong>, enable
                          <strong>MESSAGE CONTENT</strong> (and <strong>SERVER MEMBERS</strong> if you want welcome
                          messages)</li>
                      </ol>
                    </div>

                    <div class="field">
                      <div class="field-label">
                        <div class="field-title">Bot token</div>
                        <div class="field-description">Paste the token from the Bot page.</div>
                      </div>
                      <div class="field-control">
                        <input type="password" x-model="bot.token"
                          placeholder="MTExNDEyMzQ1Njc4OTAxMjM0NTY3OA.YourTokenHere" />
                      </div>
                    </div>

                    <div class="field">
                      <div class="field-label">
                        <div class="field-title">Application ID</div>
                        <div class="field-description">Used to build the invite URL. Auto-filled after a successful
                          connection test.</div>
                      </div>
                      <div class="field-control">
                        <input type="text" x-model="bot.client_id" placeholder="Application ID from General Information" />
                      </div>
                    </div>

                    <div class="dc-intents-warning">
                      <span aria-hidden="true">&#9888;</span>
                      <span x-text="$store.discordConfig.intentsWarning(bot)"></span>
                    </div>
                  </div>
                </template>

                <template x-if="$store.discordConfig.currentStep === 1">
                  <div class="dc-step-panel">
                    <div class="field">
                      <div class="field-label">
                        <div class="field-title">Turn on this bot</div>
                        <div class="field-description">Enable the gateway connection when you are ready for the bot to
                          go live.</div>
                      </div>
                      <div class="field-control">
                        <label class="toggle">
                          <input type="checkbox" x-model="bot.enabled" />
                          <span class="toggler"></span>
                        </label>
                      </div>
                    </div>

                    <div class="field">
                      <div class="field-label">
                        <div class="field-title">Bot name</div>
                        <div class="field-description">A friendly internal label so you can tell bots apart.</div>
                      </div>
                      <div class="field-control">
                        <input type="text" x-model="bot.name" placeholder="support_bot" />
                      </div>
                    </div>

                    <div class="field">
                      <div class="field-label">
                        <div class="field-title">Invite URL</div>
                        <div class="field-description">Paste this in a browser to add the bot to one of your servers.
                        </div>
                      </div>
                      <div class="field-control dc-invite-row">
                        <input type="text" readonly :value="$store.discordConfig.inviteUrl(bot)"
                          placeholder="Test the connection to populate the Application ID first." />
                        <button class="btn btn-field" type="button"
                          :disabled="!$store.discordConfig.inviteUrl(bot)"
                          @click="$store.discordConfig.copyInviteUrl(bot)">Copy</button>
                      </div>
                    </div>

                    <div class="field">
                      <div class="field-label">
                        <div class="field-title">Allowed users</div>
                        <div class="field-description">Comma-separated Discord user IDs. Leave empty only if you truly
                          want open access.</div>
                      </div>
                      <div class="field-control">
                        <input type="text" :value="$store.discordConfig.allowedUsersText(bot)"
                          @input="$store.discordConfig.setAllowedUsers(bot, $event.target.value)"
                          placeholder="123456789012345678, 987654321098765432" />
                      </div>
                    </div>

                    <div class="field">
                      <div class="field-label">
                        <div class="field-title">Allowed servers</div>
                        <div class="field-description">Comma-separated Discord guild IDs. Empty = respond in any server
                          the bot is in.</div>
                      </div>
                      <div class="field-control">
                        <input type="text" :value="$store.discordConfig.allowedGuildsText(bot)"
                          @input="$store.discordConfig.setAllowedGuilds(bot, $event.target.value)"
                          placeholder="111222333444555666" />
                      </div>
                    </div>

                    <div class="dc-warning" x-show="$store.discordConfig.accessWarning(bot)">
                      <span x-text="$store.discordConfig.accessWarning(bot)"></span>
                    </div>

                    <div class="field">
                      <div class="field-label">
                        <div class="field-title">Default project</div>
                        <div class="field-description">Optional fallback project for conversations from this bot.</div>
                      </div>
                      <div class="field-control">
                        <select :value="bot.default_project" @change="bot.default_project = $event.target.value">
                          <option value="">No project</option>
                          <template x-for="proj in $store.discordConfig.projects" :key="proj.name">
                            <option :value="proj.name" x-text="proj.title || proj.name"
                              :selected="bot.default_project === proj.name"></option>
                          </template>
                        </select>
                      </div>
                    </div>
                  </div>
                </template>

                <template x-if="$store.discordConfig.currentStep === 2">
                  <div class="dc-step-panel">
                    <div class="field">
                      <div class="field-label">
                        <div class="field-title">Server behavior</div>
                        <div class="field-description">Choose how the bot responds inside Discord servers. DMs always
                          work.</div>
                      </div>
                      <div class="field-control">
                        <select x-model="bot.server_mode">
                          <option value="mention">Reply when @mentioned or replied to</option>
                          <option value="all">Reply to every message in allowed servers</option>
                          <option value="off">Ignore server messages (DMs only)</option>
                        </select>
                      </div>
                    </div>

                    <div class="field" x-show="bot.server_mode !== 'off'">
                      <div class="field-label">
                        <div class="field-title">Welcome new members</div>
                        <div class="field-description">Greet people when they join the server. Requires the SERVER
                          MEMBERS privileged intent.</div>
                      </div>
                      <div class="field-control">
                        <label class="toggle">
                          <input type="checkbox" x-model="bot.welcome_enabled" />
                          <span class="toggler"></span>
                        </label>
                      </div>
                    </div>

                    <div class="field" x-show="bot.server_mode !== 'off' && bot.welcome_enabled">
                      <div class="field-label">
                        <div class="field-title">Welcome message</div>
                        <div class="field-description">Use {name} for the new member's name.</div>
                      </div>
                      <div class="field-control">
                        <input type="text" x-model="bot.welcome_message" placeholder="Welcome, {name}!" />
                      </div>
                    </div>

                    <div class="field">
                      <div class="field-label">
                        <div class="field-title">Agent instructions</div>
                        <div class="field-description">Extra guidance for how the agent should reply in Discord chats.
                        </div>
                      </div>
                      <div class="field-control">
                        <textarea x-model="bot.agent_instructions" rows="3"
                          placeholder="Reply briefly and naturally, like a chat conversation."></textarea>
                      </div>
                    </div>
                  </div>
                </template>

                <div class="dc-test-panel">
                  <div class="dc-test-copy">
                    <div class="dc-test-title">Check the connection</div>
                    <div class="dc-test-description" x-text="$store.discordConfig.testIntro()"></div>
                  </div>
                  <button class="btn btn-field" @click.stop="$store.discordConfig.testConnection(idx)"
                    :disabled="$store.discordConfig.testing === idx || !$store.discordConfig.canTest(bot)">
                    <span x-text="$store.discordConfig.testButtonLabel(bot, idx)"></span>
                  </button>
                </div>

                <template x-if="$store.discordConfig.testResults && $store.discordConfig.testResultsFor === idx">
                  <div class="dc-results" :class="{ 'is-error': !$store.discordConfig.testResults.success }">
                    <template x-for="result in $store.discordConfig.testResults.results"
                      :key="result.test + result.message">
                      <div class="dc-result-row">
                        <span class="dc-result-icon" x-text="result.ok ? '✓' : '✗'"></span>
                        <div class="dc-result-copy">
                          <div class="dc-result-title" x-text="$store.discordConfig.resultTitle(result)"></div>
                          <div class="dc-result-message" x-text="$store.discordConfig.resultMessage(result)"></div>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="$store.discordConfig.currentStep > 0">
                  <details class="dc-advanced">
                    <summary>
                      <span>Advanced</span>
                      <span class="material-symbols-outlined dc-advanced-chevron"
                        aria-hidden="true">keyboard_arrow_down</span>
                    </summary>
                    <div class="dc-advanced-body">
                      <div class="field">
                        <div class="field-label">
                          <div class="field-title">Message notifications</div>
                          <div class="field-description">Show a WebUI notification for each incoming Discord message.
                          </div>
                        </div>
                        <div class="field-control">
                          <label class="toggle">
                            <input type="checkbox" x-model="bot.notify_messages" />
                            <span class="toggler"></span>
                          </label>
                        </div>
                      </div>

                      <div class="field">
                        <div class="field-label">
                          <div class="field-title">User project mapping</div>
                          <div class="field-description">Map specific Discord user IDs to projects with user_id=project
                            entries.</div>
                        </div>
                        <div class="field-control">
                          <input type="text" :value="$store.discordConfig.userProjectsText(bot)"
                            @input="$store.discordConfig.setUserProjects(bot, $event.target.value)"
                            placeholder="123456789=my_project, 987654321=other_project" />
                        </div>
                      </div>

                      <div class="field">
                        <div class="field-label">
                          <div class="field-title">Attachment max age</div>
                          <div class="field-description">How long to keep downloaded attachments. Use 0 to keep them
                            forever.</div>
                        </div>
                        <div class="field-control">
                          <input type="number" x-model.number="bot.attachment_max_age_hours" min="0" step="1"
                            placeholder="0" />
                        </div>
                      </div>
                    </div>
                  </details>
                </template>
              </div>
            </template>
          </div>
        </template>

        <template x-if="$store.discordConfig.bots.length > 0">
          <button class="btn btn-field dc-add-btn" @click="$store.discordConfig.addBot()">
            Connect another bot
          </button>
        </template>
      </div>
    </template>
  </div>

  <style>
    .dc-page {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .dc-empty,
    .dc-card {
      border-radius: 0.5rem;
    }

    .dc-empty {
      padding: 1rem;
    }

    .dc-empty-title,
    .dc-step-title,
    .dc-test-title,
    .dc-token-steps-title {
      font-weight: 700;
    }

    .dc-empty-copy,
    .dc-step-description,
    .dc-test-description,
    .dc-result-message,
    .dc-card-subtitle {
      color: var(--color-text-secondary);
      line-height: 1.5;
    }

    .dc-empty-copy {
      margin-top: 0.35rem;
      margin-bottom: 0.9rem;
    }

    .dc-card-header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      padding: var(--spacing-sm) 0;
      border-bottom: 1px solid var(--color-border);
      cursor: pointer;
    }

    .dc-card-heading {
      min-width: 0;
      flex: 1 1 auto;
    }

    .dc-card-title {
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .dc-card-subtitle {
      margin-top: 0.3rem;
      font-size: var(--font-size-small);
    }

    .dc-card-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex: 0 0 auto;
    }

    .dc-card-chevron {
      transition: transform 0.18s ease;
      opacity: 0.7;
    }

    .dc-card-chevron.is-open {
      transform: rotate(180deg);
    }

    .dc-card-body {
      border-top: 1px solid color-mix(in srgb, var(--color-border) 88%, white 12%);
    }

    .dc-step-header {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: flex-start;
      margin: 1rem 0;
    }

    .dc-step-dots {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
    }

    .dc-step-dot {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .dc-step-dot.is-active {
      background: rgba(88, 101, 242, 0.9);
      border-color: rgba(88, 101, 242, 0.9);
    }

    .dc-step-panel {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .dc-token-steps {
      margin-bottom: 1rem;
    }

    .dc-token-steps-list {
      margin: 0;
      padding-left: 1.15rem;
      color: var(--color-text-secondary);
      line-height: 1.55;
    }

    .dc-token-steps-list a {
      color: var(--color-highlight);
    }

    .dc-invite-row {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }

    .dc-invite-row input {
      flex: 1 1 auto;
      min-width: 0;
    }

    .dc-intents-warning {
      margin: 0.75rem 0;
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      border: 1px solid rgba(88, 101, 242, 0.45);
      background: rgba(88, 101, 242, 0.12);
      display: flex;
      gap: 0.55rem;
      align-items: flex-start;
      font-size: var(--font-size-small);
      line-height: 1.5;
    }

    .dc-warning {
      margin: 0.5rem 0 1.25rem;
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      border: 1px solid rgba(255, 170, 0, 0.45);
      background: rgba(255, 170, 0, 0.12);
      color: var(--color-warning-text);
      font-size: var(--font-size-small);
    }

    .dc-test-panel {
      margin-top: 1rem;
      padding: var(--spacing-xs) 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .dc-test-copy,
    .dc-result-copy {
      min-width: 0;
    }

    .dc-results {
      margin-top: 0.9rem;
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, #22c55e 28%, var(--color-border) 72%);
      background: color-mix(in srgb, #22c55e 8%, var(--color-background) 92%);
      padding: 0.35rem 0.9rem;
    }

    .dc-results.is-error {
      border-color: color-mix(in srgb, #ef4444 28%, var(--color-border) 72%);
      background: color-mix(in srgb, #ef4444 8%, var(--color-background) 92%);
    }

    .dc-result-row {
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      padding: 0.7rem 0;
    }

    .dc-result-row+.dc-result-row {
      border-top: 1px solid color-mix(in srgb, var(--color-border) 85%, white 15%);
    }

    .dc-result-icon {
      width: 1.25rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .dc-result-title {
      font-weight: 700;
      margin-bottom: 0.18rem;
    }

    .dc-status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 5.25rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .dc-status-pill.tone-success {
      background: rgba(34, 197, 94, 0.14);
      color: #7ee7a4;
    }

    .dc-status-pill.tone-ready {
      background: rgba(88, 101, 242, 0.16);
      color: #a7b1ff;
    }

    .dc-status-pill.tone-warning {
      background: rgba(245, 158, 11, 0.16);
      color: #fcd34d;
    }

    .dc-status-pill.tone-muted {
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
    }

    .dc-advanced {
      margin-top: 1rem;
      border: 1px solid color-mix(in srgb, var(--color-border) 88%, white 12%);
      border-radius: 14px;
      overflow: hidden;
    }

    .dc-advanced summary {
      cursor: pointer;
      list-style: none;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1rem;
      background: color-mix(in srgb, var(--color-background) 88%, white 12%);
    }

    .dc-advanced summary::-webkit-details-marker {
      display: none;
    }

    .dc-advanced-chevron {
      margin-left: auto;
      flex: 0 0 auto;
      transition: transform 0.18s ease, opacity 0.18s ease;
      opacity: 0.72;
    }

    .dc-advanced[open] .dc-advanced-chevron {
      transform: rotate(180deg);
      opacity: 1;
    }

    .dc-advanced-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .dc-add-btn {
      align-self: flex-start;
    }
  </style>
</body>

</html>
